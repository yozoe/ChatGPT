name: macOS CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out Codex Desk
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Check Dart structure
        run: dart run tool/check_dart_structure.dart

      - name: Analyze
        run: flutter analyze

      - name: Verify test shard coverage
        run: dart run tool/test_shards.dart --verify

      - name: Prepare macOS Flutter configuration
        run: flutter build macos --debug --config-only

      - name: Test macOS native layer
        shell: bash
        run: |
          set +e
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' test -quiet 2>&1 | tee "$RUNNER_TEMP/native-test.log"
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            {
              echo '### macOS native test failure summary'
              echo
              echo '```text'
              rg 'Test Suite|Test Case|TEST FAILED|error:|fatal error:' "$RUNNER_TEMP/native-test.log" | tail -40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r failure; do
              failure=${failure//'%'/'%25'}
              failure=${failure//$'\r'/'%0D'}
              failure=${failure//$'\n'/'%0A'}
              echo "::error title=macOS native test::$failure"
            done < <(tail -30 "$RUNNER_TEMP/native-test.log")
          fi
          exit "$status"

  verify-performance:
    name: Verify macOS performance benchmark
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out Codex Desk
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify performance benchmark harness
        run: flutter test integration_test/profile_performance_benchmark_test.dart -d macos

  verify-build:
    name: Verify macOS debug build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out Codex Desk
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS Debug
        run: flutter build macos --debug

  test-shards:
    name: Test ${{ matrix.shard }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [composer, runtime, browser, git, workspace, settings, misc]
    steps:
      - name: Check out Codex Desk
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run ${{ matrix.shard }} tests
        run: dart run tool/test_shards.dart --shard "${{ matrix.shard }}"
